
name: Publish Container Image

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Publish a versioned image from main?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish to GHCR
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm_publish == true

    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compute lowercase image name
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" \
            >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image locally for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Smoke-test image without real services
        shell: bash
        run: |
          docker run -d --rm \
            --name ai-agent-release-smoke \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m \
            -e DATABASE_URL=postgresql+psycopg://ci:ci@127.0.0.1:5432/ci \
            -e DEV_JOB_WRITE_KEY=ci-placeholder-not-secret \
            -e RESUME_AI_ENABLED=false \
            -e LANGCHAIN_EXPLANATIONS_ENABLED=false \
            -e APPLICATION_DRAFTS_AI_ENABLED=false \
            "${IMAGE}:sha-${GITHUB_SHA}"

          for attempt in $(seq 1 40); do
            if docker exec ai-agent-release-smoke \
              python -m app.scripts.smoke_deployment \
              --skip-database; then
              echo "PASS: Image smoke test"
              exit 0
            fi

            sleep 3
          done

          echo "FAIL: Image startup verification"
          exit 1

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f ai-agent-release-smoke || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        shell: bash
        run: |
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
