[project]
name = "ai-job-agent"
version = "0.1.0"
description = "AI-powered job application assistant"
requires-python = ">=3.10.2"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]